<div class="booking-modal" id="bookingModal" hidden>
  <div class="booking-modal__overlay" data-close-booking-modal></div>

  <div class="booking-modal__dialog">
    <button type="button" class="booking-modal__close" data-close-booking-modal>
      ×
    </button>

    <h2 data-i18n="completeReservation">Completa tu reserva</h2>

    <form id="reservationForm">
      <div class="grid-2">
        <div class="field">
          <label data-i18n="fullName">Nombre completo</label>
          <input type="text" name="fullName" required />
        </div>

        <div class="field">
          <label data-i18n="email">Correo electrónico</label>
          <input type="email" name="email" required />
        </div>

        <div class="field">
          <label data-i18n="whatsapp">WhatsApp</label>
          <input type="text" name="whatsapp" required />
        </div>

        <div class="field">
          <label data-i18n="nationality">Nacionalidad</label>
          <input type="text" name="nationality" required />
        </div>

        <div class="field">
          <label data-i18n="documentType">Tipo de documento</label>
          <select name="documentType" required>
            <option value="passport">Pasaporte</option>
            <option value="dni">DNI</option>
            <option value="id-card">ID Card</option>
          </select>
        </div>

        <div class="field">
          <label data-i18n="documentNumber">Número de documento</label>
          <input type="text" name="documentNumber" required />
        </div>
      </div>

      <section class="reservation-passengers">
        <h3 data-i18n="passengers">Pasajeros</h3>
        <div data-passengers-list></div>
      </section>

      <section class="reservation-final-summary">
        <h3 data-i18n="reservationSummary">Resumen de reserva</h3>
        <div data-final-summary></div>
      </section>

      <div class="booking-modal__actions">
        <button type="button" id="reserveOnlyBtn" class="btn-secondary" data-i18n="reserveOnly">
          Solo reservar
        </button>

        <button type="button" id="payNowBtn" class="btn-primary" data-i18n="payNow">
          Pagar ahora
        </button>
      </div>
    </form>
  </div>
</div>
