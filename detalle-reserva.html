<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Reserva | MyCuscoTrip</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/header.css">
  <link rel="stylesheet" href="./assets/css/footer.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">

  <style>
    :root {
      --brand-green: #053220;
      --brand-green-2: #0b5d3b;
      --brand-gold: #d6b15d;
      --brand-cream: #f8f5ee;
      --text-main: #1f2937;
      --text-soft: #667085;
      --line: #e5e7eb;
      --danger-soft: #fff1f2;
      --danger-text: #be123c;
      --success-soft: #edfdf4;
      --success-text: #166534;
      --print-border: #c9c9c9;
      --print-head: #e8cf86;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      color: var(--text-main);
      background: #f5f6f8;
    }

    .voucher-page {
      padding: 120px 0 70px;
      background:
        linear-gradient(rgba(4, 31, 21, .82), rgba(4, 31, 21, .82)),
        url("./assets/img/reserva/machu-picchu-fondo.jpg") center/cover no-repeat fixed;
      min-height: 100vh;
    }

    .voucher-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: .95rem;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--brand-green), var(--brand-green-2));
      color: white;
    }

    .action-btn.secondary {
      background: white;
      color: var(--brand-green);
    }

    .voucher-web {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.18);
    }

    .voucher-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--brand-green);
      color: white;
    }

    .voucher-hero-left {
      padding: 42px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
    }

    .brand-box h1 {
      margin: 0 0 10px;
      font-family: 'Montserrat', sans-serif;
      font-size: 2.8rem;
      line-height: 1;
    }

    .brand-box p {
      margin: 0;
      color: rgba(255,255,255,.88);
      line-height: 1.7;
    }

    .hero-contact {
      display: grid;
      gap: 8px;
      color: rgba(255,255,255,.92);
      font-size: .96rem;
    }

    .voucher-hero-right {
      display: grid;
      grid-template-rows: auto 220px;
      background: #093f29;
    }

    .voucher-code-box {
      padding: 36px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }

    .voucher-code-box .voucher-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2rem, 4vw, 4rem);
      font-weight: 800;
      line-height: 1;
      text-align: right;
    }

    .voucher-meta-card {
      width: 100%;
      max-width: 420px;
      background: white;
      color: var(--brand-green);
      border: 1px solid rgba(255,255,255,.12);
    }

    .voucher-meta-card .date {
      background: var(--brand-green);
      color: white;
      padding: 14px 18px;
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      font-family: 'Montserrat', sans-serif;
    }

    .voucher-meta-card .code {
      padding: 14px 18px;
      font-size: 2rem;
      text-align: center;
      letter-spacing: .18em;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
    }

    .voucher-hero-image {
      background: url("./assets/img/reserva/machu-picchu-card.jpg") center/cover no-repeat;
      min-height: 220px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 28px;
      padding: 28px;
      background: #fafaf8;
    }

    .main-column,
    .side-column {
      display: grid;
      gap: 22px;
      align-content: start;
    }

    .card {
      background: white;
      border: 1px solid #edf0f2;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.04);
      overflow: hidden;
    }

    .card-head {
      padding: 18px 22px;
      border-bottom: 1px solid #eef1f3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-head h2 {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.2rem;
      color: var(--brand-green);
    }

    .card-body {
      padding: 20px 22px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 18px;
    }

    .info-item {
      padding: 14px 16px;
      border-radius: 16px;
      background: #f7f8f6;
      border: 1px solid #edf0ea;
    }

    .info-item .label {
      display: block;
      margin-bottom: 6px;
      color: #667085;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .info-item .value {
      font-weight: 700;
      color: #13221a;
      line-height: 1.5;
    }

    .tourist-table,
    .services-table,
    .flight-table {
      width: 100%;
      border-collapse: collapse;
    }

    .tourist-table th,
    .tourist-table td,
    .services-table th,
    .services-table td,
    .flight-table th,
    .flight-table td {
      padding: 12px 10px;
      border-bottom: 1px solid #eef2f5;
      text-align: left;
      font-size: .93rem;
      vertical-align: top;
    }

    .tourist-table th,
    .services-table th,
    .flight-table th {
      background: #f7f8f6;
      color: #374151;
      font-size: .82rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .76rem;
      font-weight: 700;
    }

    .badge.included {
      background: var(--success-soft);
      color: var(--success-text);
    }

    .badge.extra {
      background: #fff7ed;
      color: #b45309;
    }

    .hotel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .hotel-card {
      border: 1px solid #edf0f2;
      background: #fbfcfa;
      border-radius: 18px;
      padding: 16px;
    }

    .hotel-card h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--brand-green);
      font-family: 'Montserrat', sans-serif;
    }

    .hotel-card p {
      margin: 6px 0;
      font-size: .92rem;
      color: #46525d;
      line-height: 1.55;
    }

    .includes-list,
    .extra-list,
    .notes-list {
      margin: 0;
      padding-left: 18px;
    }

    .includes-list li,
    .extra-list li,
    .notes-list li {
      margin-bottom: 10px;
      line-height: 1.65;
    }

    .pay-stack {
      display: grid;
      gap: 14px;
    }

    .pay-card {
      border: 1px solid #ebefe9;
      background: linear-gradient(180deg, #ffffff 0%, #faf8f2 100%);
      border-radius: 18px;
      padding: 18px;
    }

    .pay-card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      color: var(--brand-green);
      font-family: 'Montserrat', sans-serif;
    }

    .pay-card p {
      margin: 0 0 10px;
      color: #667085;
      line-height: 1.6;
      font-size: .92rem;
    }

    .amounts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .amount-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f6f7f9;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 9px 12px;
      font-size: .88rem;
      font-weight: 700;
    }

    .pay-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--brand-green), var(--brand-green-2));
      color: white;
      text-decoration: none;
      font-weight: 700;
      text-align: center;
    }

    .alert-box {
      border-radius: 16px;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
      color: #475467;
      line-height: 1.65;
      font-size: .93rem;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #475467;
    }

    .empty-state h1 {
      font-family: 'Montserrat', sans-serif;
      color: var(--brand-green);
    }

    .back-home {
      display: inline-flex;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--brand-green);
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .print-voucher {
      display: none;
      background: white;
      color: #222;
      padding: 24px;
      max-width: 1100px;
      margin: 0 auto;
      font-family: Arial, sans-serif;
    }

    .pv-top {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 24px;
      margin-bottom: 18px;
      align-items: start;
    }

    .pv-brand {
      font-size: 14px;
      line-height: 1.5;
      color: #5d6b3e;
    }

    .pv-brand .logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 2rem;
      line-height: 1;
      color: #8c6a1b;
      margin-bottom: 10px;
    }

    .pv-title-box {
      text-align: center;
    }

    .pv-title-box .date {
      font-size: 1.2rem;
      color: #7c7c7c;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pv-title-box .title {
      font-size: 2.4rem;
      color: #94b5ee;
      font-weight: 800;
      letter-spacing: .03em;
      margin-bottom: 14px;
      font-family: 'Montserrat', sans-serif;
    }

    .pv-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 20px;
      font-size: 14px;
      text-align: left;
    }

    .pv-meta-grid div strong {
      display: inline-block;
      min-width: 140px;
    }

    .pv-section-title {
      margin-top: 16px;
      background: var(--print-head);
      padding: 6px 10px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
    }

    .pv-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
    }

    .pv-table th,
    .pv-table td {
      border: 1px solid var(--print-border);
      padding: 7px 8px;
      vertical-align: top;
    }

    .pv-table th {
      background: #f3f3f3;
    }

    .pv-hotel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 10px;
    }

    .pv-hotel {
      border: 1px solid var(--print-border);
      padding: 10px;
      min-height: 170px;
      font-size: 13px;
      line-height: 1.5;
      background: #fcfcfc;
    }

    .pv-bottom {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      margin-top: 14px;
    }

    .pv-box {
      border: 1px dashed #b6b6b6;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      min-height: 180px;
    }

    .pv-contact {
      text-align: center;
      display: grid;
      align-content: center;
      gap: 10px;
    }

    .pv-contact .agent {
      font-weight: 800;
      font-size: 1.1rem;
      border: 1px solid #7ea46d;
      padding: 8px 10px;
      color: #1a4b12;
    }

    .pv-contact .phone {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1f4f17;
    }

    @media (max-width: 1100px) {
      .voucher-hero,
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 767px) {
      .voucher-page {
        padding-top: 100px;
      }

      .voucher-hero-right {
        grid-template-rows: auto 180px;
      }

      .voucher-code-box {
        padding: 24px;
      }

      .content-grid {
        padding: 18px;
      }

      .card-body,
      .card-head {
        padding-left: 16px;
        padding-right: 16px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        background: white;
      }

      #header-container,
      #footer-container,
      .wa-float,
      .top-actions,
      .voucher-web {
        display: none !important;
      }

      .voucher-page {
        background: white !important;
        padding: 0 !important;
        min-height: auto !important;
      }

      .voucher-shell {
        max-width: none;
        padding: 0;
      }

      .print-voucher {
        display: block !important;
      }

      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <a class="wa-float" href="https://wa.me/51900608980" target="_blank" rel="noopener" aria-label="WhatsApp">
    <img src="./assets/img/logos/LogoWhatsapp.png" alt="WhatsApp" />
  </a>

  <main class="voucher-page">
    <div class="voucher-shell">
      <div class="top-actions">
        <button class="action-btn secondary" onclick="window.location.href='./mi-reserva.html'">
          <i class="fa-solid fa-arrow-left"></i> Volver
        </button>
        <button class="action-btn primary" onclick="window.print()">
          <i class="fa-solid fa-print"></i> Imprimir voucher
        </button>
      </div>

      <section id="voucherWeb" class="voucher-web" style="display:none;"></section>

      <section id="voucherEmpty" class="voucher-web" style="display:none;">
        <div class="empty-state">
          <h1>Reserva no encontrada</h1>
          <p>No hay una reserva cargada para mostrar.</p>
          <a href="./mi-reserva.html" class="back-home">Ir a Mi Reserva</a>
        </div>
      </section>

      <section id="voucherPrint" class="print-voucher"></section>
    </div>
  </main>

  <div id="footer-container"></div>

  <script>
    const IS_GITHUB_PAGES = window.location.hostname.includes('github.io');
    const BASE_PATH = IS_GITHUB_PAGES ? '/mycuscotrip/' : '/';

    async function loadComponent(componentName, targetId) {
      try {
        const componentPath = `${BASE_PATH}components/${componentName}.html`;
        const response = await fetch(componentPath);

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const html = await response.text();
        const target = document.getElementById(targetId);

        if (target) {
          target.innerHTML = html;
          fixImagePaths(target);
        }
      } catch (error) {
        console.error(`Error cargando ${componentName}:`, error);
      }
    }

    function fixImagePaths(container) {
      const images = container.querySelectorAll('img[src*="assets/"]');
      images.forEach(img => {
        const currentSrc = img.getAttribute('src');
        if (currentSrc.startsWith('assets/')) {
          img.setAttribute('src', `.${currentSrc}`);
        }
      });
    }

    async function initializeSharedComponents() {
      await Promise.all([
        loadComponent('header', 'header-container'),
        loadComponent('footer', 'footer-container')
      ]);
    }

    function moneyPen(value) {
      if (value === undefined || value === null || value === "") return null;
      return `S/ ${Number(value).toFixed(2)}`;
    }

    function moneyUsd(value) {
      if (value === undefined || value === null || value === "") return null;
      return `USD ${Number(value).toFixed(2)}`;
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function buildAmountPills(item) {
      const pills = [];
      const pen = moneyPen(item.montoPen);
      const usd = moneyUsd(item.montoUsd);

      if (pen) pills.push(`<span class="amount-pill">${pen}</span>`);
      if (usd) pills.push(`<span class="amount-pill">${usd}</span>`);

      return pills.join("");
    }

    function renderWebVoucher(reserva) {
      const servicios = Array.isArray(reserva.servicios) ? reserva.servicios : [];
      const incluidos = servicios.filter(s => s.incluido);
      const extrasServicios = servicios.filter(s => !s.incluido);
      const hoteles = Array.isArray(reserva.hotelInfo) ? reserva.hotelInfo : [];
      const turistas = Array.isArray(reserva.turistas) ? reserva.turistas : [];
      const vuelos = Array.isArray(reserva.vuelos) ? reserva.vuelos : [];
      const incluye = Array.isArray(reserva.incluye) ? reserva.incluye : [];
      const noIncluye = Array.isArray(reserva.noIncluye) ? reserva.noIncluye : [];
      const infoAdicional = Array.isArray(reserva.informacionAdicional) ? reserva.informacionAdicional : [];
      const pagosExtras = reserva.pagos && Array.isArray(reserva.pagos.extras) ? reserva.pagos.extras : [];
      const pagoTotal = reserva.pagos && reserva.pagos.totalPendiente ? reserva.pagos.totalPendiente : null;

      return `
        <div class="voucher-hero">
          <div class="voucher-hero-left">
            <div class="brand-box">
              <h1>MY CUSCO TRIP</h1>
              <p>Travel & Tourism Agency</p>
              <p>Especialistas diseñando viajes llenos de emociones al Valle Sagrado de los Incas.</p>
            </div>

            <div class="hero-contact">
              <div><strong>Código:</strong> ${esc(reserva.codigo)}</div>
              <div><strong>Titular:</strong> ${esc(reserva.titularReserva)}</div>
              <div><strong>Destino:</strong> ${esc(reserva.destino)}</div>
              <div><strong>Pack:</strong> ${esc(reserva.packTour)}</div>
            </div>
          </div>

          <div class="voucher-hero-right">
            <div class="voucher-code-box">
              <div class="voucher-title">TRAVEL VOUCHER</div>

              <div class="voucher-meta-card">
                <div class="date">${esc(reserva.fechaVoucher || reserva.fechaEmision || "")}</div>
                <div class="code">${esc(reserva.codigo)}</div>
              </div>
            </div>

            <div class="voucher-hero-image"></div>
          </div>
        </div>

        <div class="content-grid">
          <div class="main-column">
            <article class="card">
              <div class="card-head">
                <h2>Información general</h2>
              </div>
              <div class="card-body">
                <div class="info-grid">
                  <div class="info-item"><span class="label">Titular reserva</span><div class="value">${esc(reserva.titularReserva)}</div></div>
                  <div class="info-item"><span class="label">Idioma</span><div class="value">${esc(reserva.idioma || "-")}</div></div>
                  <div class="info-item"><span class="label">Fecha emisión</span><div class="value">${esc(reserva.fechaEmision || "-")}</div></div>
                  <div class="info-item"><span class="label">Teléfono contacto</span><div class="value">${esc(reserva.telefonoContacto || "-")}</div></div>
                  <div class="info-item"><span class="label">Cantidad paxs</span><div class="value">${esc(reserva.cantidadPaxs || turistas.length || "-")}</div></div>
                  <div class="info-item"><span class="label">Agente asignado</span><div class="value">${esc(reserva.agenteAsignado || "-")} ${reserva.agenteTelefono ? `<br>${esc(reserva.agenteTelefono)}` : ""}</div></div>
                </div>
              </div>
            </article>

            <article class="card">
              <div class="card-head">
                <h2>Datos de los turistas</h2>
              </div>
              <div class="card-body">
                <div style="overflow:auto;">
                  <table class="tourist-table">
                    <thead>
                      <tr>
                        <th>Nombre completo</th>
                        <th>Doc. tipo</th>
                        <th>Doc. número</th>
                        <th>Nacionalidad</th>
                        <th>Fecha nacimiento</th>
                        <th>Teléfono</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${turistas.map(t => `
                        <tr>
                          <td>${esc(t.nombreCompleto || `${t.nombres || ""} ${t.apellidos || ""}`.trim())}</td>
                          <td>${esc(t.tipoDocumento || t.documentoTipo || "-")}</td>
                          <td>${esc(t.numeroDocumento || t.documento || "-")}</td>
                          <td>${esc(t.nacionalidad || "-")}</td>
                          <td>${esc(t.fechaNacimiento || "-")}</td>
                          <td>${esc(t.telefono || "-")}</td>
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
              </div>
            </article>

            <article class="card">
              <div class="card-head">

            ${vuelos.length ? `
            <article class="card">
              <div class="card-head">

              <div class="card-body">

                  <table class="flight-table">
                    <thead>

                        <th>Operador</th>
                        <th>Número</th>
                        <th>Origen</th>
                        <th>Destino</th>
                        <th>Salida</th>
                        <th>Llegada</th>

                    </thead>
                    <tbody>
                      ${vuelos.map(v => `
                        <tr>
                          <td>${esc(v.operador || "-")}</td>
                          <td>${esc(v.numero || "-")}</td>
                          <td>${esc(v.origen || "-")}</td>
                          <td>${esc(v.destino || "-")}</td>
                          <td>${esc(v.salida || "-")}</td>
                          <td>${esc(v.llegada || "-")}</td>

                  </table>

          <aside class="side-column">
            ${incluye.length ? `

              <div class="card-head">
                <h2>Incluye</h2>

              <div class="card-body">
                <ul class="includes-list">

            ${(extrasServicios.length || noIncluye.length) ? `

              <div class="card-head">
                <h2>Servicios extra / No incluidos</h2>
              </div>
              <div class="card-body">
                ${extrasServicios.length ? `
                  <ul class="extra-list">
                    ${extrasServicios.map(s => `<li><strong>${esc(s.nombre)}</strong>${s.fecha ? ` — ${esc(s.fecha)}` : ""}</li>`).join("")}

            ${(pagoTotal || pagosExtras.length) ? `
            <article class="card">
              <div class="card-head">
                <h2>Pagos pendientes</h2>
              </div>
              <div class="card-body">
                <div class="pay-stack">
                  ${pagoTotal ? `
                    <div class="pay-card">
                      <h3>${esc(pagoTotal.label || "Completar pago total")}</h3>
                      <p>${esc(pagoTotal.descripcion || "Usa este enlace para completar el pago total de la reserva.")}</p>

              </div>

                    <strong>Agente asignado:</strong><br>

                    ${esc(reserva.agenteTelefono || "-")}

            </article>` : ""}
          </aside>
        </div>

    }

    function renderPrintVoucher(reserva) {
      const turistas = Array.isArray(reserva.turistas) ? reserva.turistas : [];
      const hoteles = Array.isArray(reserva.hotelInfo) ? reserva.hotelInfo : [];
      const servicios = Array.isArray(reserva.servicios) ? reserva.servicios : [];
      const vuelos = Array.isArray(reserva.vuelos) ? reserva.vuelos : [];
      const noIncluye = Array.isArray(reserva.noIncluye) ? reserva.noIncluye : [];
      const infoAdicional = Array.isArray(reserva.informacionAdicional) ? reserva.informacionAdicional : [];
      const pagoTotal = reserva.pagos && reserva.pagos.totalPendiente ? reserva.pagos.totalPendiente : null;
      const pagosExtras = reserva.pagos && Array.isArray(reserva.pagos.extras) ? reserva.pagos.extras : [];

      return `
        <div class="pv-top">
          <div class="pv-brand">
            <div class="logo">MY CUSCO TRIP</div>
            <div>Travel & Tourism Agency</div>
            <div>Especialistas diseñando viajes llenos de emociones al Valle Sagrado de los Incas</div>
            <br>
            <div>Av. Ejército 1630 - Cusco</div>
            <div>Phone: (51) 231-1303 / 084-643003</div>
            <div>reservas@mycuscotrip.com</div>
            <div>www.mycuscotrip.com</div>
          </div>

          <div class="pv-title-box">
            <div class="date">${esc(reserva.fechaVoucher || reserva.fechaEmision || "")}</div>
            <div class="title">TRAVEL VOUCHER</div>

            <div class="pv-meta-grid">
              <div><strong>COD. RESERVA:</strong> ${esc(reserva.codigo)}</div>
              <div><strong>IDIOMA:</strong> ${esc(reserva.idioma || "-")}</div>
              <div><strong>FECHA EMISION:</strong> ${esc(reserva.fechaEmision || "-")}</div>
              <div><strong>TITULAR RESERVA:</strong> ${esc(reserva.titularReserva || "-")}</div>
              <div><strong>TELF. CONTACTO:</strong> ${esc(reserva.telefonoContacto || "-")}</div>
              <div><strong>CANT. PAXS:</strong> ${esc(reserva.cantidadPaxs || turistas.length || "-")}</div>
              <div><strong>DESTINO:</strong> ${esc(reserva.destino || "-")}</div>
              <div><strong>PACK TOUR:</strong> ${esc(reserva.packTour || "-")}</div>
              <div><strong>AGENTE:</strong> ${esc(reserva.agenteAsignado || "-")}</div>
            </div>
          </div>
        </div>

        <div class="pv-section-title">Nombres de los turistas</div>
        <table class="pv-table">
          <thead>
            <tr>
              <th>Nombre completo</th>
              <th>Doc. tipo</th>
              <th>Doc. número</th>
              <th>Nacionalidad</th>
              <th>Fecha de nacimiento</th>
              <th>Teléfono</th>
            </tr>
          </thead>
          <tbody>
            ${turistas.map(t => `
              <tr>
                <td>${esc(t.nombreCompleto || `${t.nombres || ""} ${t.apellidos || ""}`.trim())}</td>
                <td>${esc(t.tipoDocumento || t.documentoTipo || "-")}</td>
                <td>${esc(t.numeroDocumento || t.documento || "-")}</td>
                <td>${esc(t.nacionalidad || "-")}</td>
                <td>${esc(t.fechaNacimiento || "-")}</td>
                <td>${esc(t.telefono || "-")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        ${hoteles.length ? `
          <div class="pv-section-title">Información de hoteles</div>
          <div class="pv-hotel-grid">
            ${hoteles.map(h => `
              <div class="pv-hotel">
                <strong>Nombre Hotel:</strong> ${esc(h.nombre || "-")}<br>
                <strong>Ubicación:</strong> ${esc(h.ubicacion || "-")}<br>
                <strong>Check-in:</strong> ${esc(h.checkIn || "-")}<br>
                <strong>Check-out:</strong> ${esc(h.checkOut || "-")}<br>
                <strong>Total Noches:</strong> ${esc(h.noches || "-")}<br>
                <strong>Categoría:</strong> ${esc(h.categoria || "-")}<br>
                <strong>Tipo Habitación:</strong> ${esc(h.habitacion || "-")}<br>
                <strong>Dirección:</strong> ${esc(h.direccion || "-")}<br>
                <strong>Teléfono:</strong> ${esc(h.telefono || "-")}<br>
                <strong>Obs:</strong> ${esc(h.observaciones || "-")}
              </div>
            `).join("")}
          </div>
        ` : ""}

        <div class="pv-section-title">Servicios turísticos</div>
        <table class="pv-table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Servicio turístico</th>
              <th>Fecha</th>
              <th>Hora inicio</th>
              <th>Hora fin</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            ${servicios.map(s => `
              <tr>
                <td>${esc(s.codigo || "-")}</td>
                <td>${esc(s.nombre || "-")}</td>
                <td>${esc(s.fecha || "-")}</td>
                <td>${esc(s.horaInicio || "-")}</td>
                <td>${esc(s.horaFin || "-")}</td>
                <td>${s.incluido ? "Incluido" : "No incluido / Extra"}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        ${vuelos.length ? `
          <div class="pv-section-title">Itinerario de vuelos / buses</div>
          <table class="pv-table">
            <thead>
              <tr>
                <th>Operador</th>
                <th>Número</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Salida</th>
                <th>Llegada</th>
              </tr>
            </thead>
            <tbody>
              ${vuelos.map(v => `
                <tr>
                  <td>${esc(v.operador || "-")}</td>
                  <td>${esc(v.numero || "-")}</td>
                  <td>${esc(v.origen || "-")}</td>
                  <td>${esc(v.destino || "-")}</td>
                  <td>${esc(v.salida || "-")}</td>
                  <td>${esc(v.llegada || "-")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        ` : ""}

        <div class="pv-section-title">Información adicional</div>
        <div class="pv-bottom">
          <div class="pv-box">
            <strong>TENER EN CUENTA:</strong><br>
            ${infoAdicional.length ? infoAdicional.map(i => `• ${esc(i)}`).join("<br>") : "• Revisar su itinerario con anticipación.<br>• Presentar documento original en cada servicio."}
            ${noIncluye.length ? `<br><br><strong>NO INCLUYE:</strong><br>${noIncluye.map(i => `• ${esc(i)}`).join("<br>")}` : ""}
            ${(pagoTotal || pagosExtras.length) ? `<br><br><strong>PAGOS PENDIENTES:</strong><br>` : ""}
            ${pagoTotal ? `• ${esc(pagoTotal.label || "Completar pago total")} — ${esc(moneyPen(pagoTotal.montoPen) || "")} ${esc(moneyUsd(pagoTotal.montoUsd) || "")}<br>` : ""}
            ${pagosExtras.map(p => `• ${esc(p.label || "Pago extra")} — ${esc(moneyPen(p.montoPen) || "")} ${esc(moneyUsd(p.montoUsd) || "")}`).join("<br>")}
          </div>

          <div class="pv-box pv-contact">
            <div>Para toda clase de asistencia durante su viaje puede contactarse con su agente asignado:</div>
            <div class="agent">${esc(reserva.agenteAsignado || "-")}</div>
            <div class="phone">${esc(reserva.agenteTelefono || "-")}</div>
            <div>¡NOS VAMOS A MACHU PICCHU!</div>
          </div>
        </div>
      `;
    }

    function initVoucher() {
      const reservaRaw = localStorage.getItem("reservaSeleccionada");
      const webEl = document.getElementById("voucherWeb");
      const emptyEl = document.getElementById("voucherEmpty");
      const printEl = document.getElementById("voucherPrint");

      if (!reservaRaw) {
        emptyEl.style.display = "block";
        return;
      }

      try {
        const reserva = JSON.parse(reservaRaw);
        webEl.innerHTML = renderWebVoucher(reserva);
        printEl.innerHTML = renderPrintVoucher(reserva);
        webEl.style.display = "block";
      } catch (error) {
        console.error("Error leyendo reserva:", error);
        emptyEl.style.display = "block";
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', async () => {
        await initializeSharedComponents();
        initVoucher();
      });
    } else {
      initializeSharedComponents().then(initVoucher);
    }
  </script>

  <script src="./assets/js/components/header.js"></script>
  <script src="./assets/js/lib/utils.js"></script>
</body>
</html>
