<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Reserva | MyCuscoTrip</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/header.css">
  <link rel="stylesheet" href="./assets/css/footer.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">

  <style>
    :root {
      --brand-primary: #0f172a;
      --brand-dark-green: #253b2f;
      --brand-accent: #c8a96b;
      --brand-accent-soft: #f7f1e7;
      --text-main: #1f2937;
      --text-soft: #667085;
      --text-mid: #7b7b7b;
      --line: #e6e8ec;
      --bg-soft: #f7f8fa;
      --white: #ffffff;
      --success-soft: #ecfdf3;
      --success-text: #166534;
      --warning-soft: #fff7ed;
      --warning-text: #b45309;
      --shadow-lg: 0 24px 80px rgba(15, 23, 42, 0.10);
      --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.05);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;

      /* CAMBIA ESTE COLOR SI QUIERES OTRO PARA LOS TITULOS DE SECCION */
      --section-title-bg: #ffd400;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      color: var(--text-main);
      background: #f3f5f7;
    }

    .voucher-page {
      min-height: 100vh;
      padding: 92px 0 60px;
      background:
        linear-gradient(rgba(255,255,255,.86), rgba(255,255,255,.86)),
        url("./assets/img/reserva/machu-picchu-fondo.jpg") center/cover no-repeat fixed;
    }

    .voucher-shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .top-actions-right {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow-md);
    }

    .lang-switcher label {
      font-size: .85rem;
      color: var(--text-soft);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .lang-switcher select {
      border: none;
      background: transparent;
      font-size: .95rem;
      font-weight: 700;
      color: var(--brand-primary);
      outline: none;
      cursor: pointer;
    }

    .action-btn {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: .95rem;
      transition: .2s ease;
    }

    .action-btn.primary {
      background: var(--brand-primary);
      color: white;
      box-shadow: var(--shadow-md);
    }

    .action-btn.secondary {
      background: white;
      color: var(--brand-primary);
      border: 1px solid var(--line);
    }

    .action-btn:hover {
      transform: translateY(-1px);
    }

    .voucher-web {
      background: white;
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(15, 23, 42, 0.04);
    }

    .voucher-top {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 28px;
      padding: 26px 34px 20px;
      border-bottom: 1px solid var(--line);
      background: white;
    }

    .voucher-brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }

    .voucher-brand img {
      width: 319px; /* 10% mas grande aprox */
      max-width: 100%;
      height: auto;
      display: block;
    }

    .voucher-brand .subcopy {
      width: 319px;
      max-width: 100%;
      color: var(--text-mid);
      line-height: 1.42;
      font-size: .96rem;
      text-align: center;
      margin: 0;
    }

    .voucher-brand .contact {
      width: 319px;
      max-width: 100%;
      display: grid;
      gap: 4px;
      color: var(--brand-dark-green);
      font-size: .92rem;
      line-height: 1.5;
      text-align: center;
    }

    .voucher-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .voucher-head-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .voucher-head .date {
      color: var(--text-mid);
      font-weight: 700;
      font-size: 1.44rem; /* 20% mas grande aprox */
      line-height: 1.2;
      margin-bottom: 10px;
      text-align: center;
      white-space: nowrap;
    }

    .voucher-head .title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2rem, 3vw, 3.1rem);
      line-height: 1;
      letter-spacing: .02em;
      color: var(--brand-dark-green);
      margin: 0 0 14px;
      text-align: center;
      white-space: nowrap;
    }

    .voucher-code {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 20px;
      border-radius: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid var(--line);
      min-width: 300px;
      text-align: center;
    }

    .voucher-code span {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-soft);
      font-weight: 700;
    }

    .voucher-code strong {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      letter-spacing: .1em;
      color: var(--brand-primary);
      text-align: center;
    }

    .voucher-qr {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .voucher-qr img {
      width: 122px;
      height: 122px;
      object-fit: contain;
      display: block;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px;
      background: white;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      padding: 18px 34px 22px;
      background: #fcfcfd;
      border-bottom: 1px solid var(--line);
    }

    .summary-card {
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      min-height: 98px;
    }

    .summary-card .label {
      display: block;
      margin-bottom: 7px;
      font-size: .78rem;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--text-soft);
      font-weight: 700;
    }

    .summary-card .value {
      font-size: .98rem;
      line-height: 1.55;
      font-weight: 700;
      color: var(--brand-primary);
      word-break: break-word;
    }

    .voucher-content {
      display: grid;
      grid-template-columns: 1.35fr .75fr;
      gap: 22px;
      padding: 24px 34px 30px;
      background: #fafbfc;
    }

    .main-column,
    .side-column {
      display: grid;
      gap: 20px;
      align-content: start;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--section-title-bg);
    }

    .card-head h2 {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.08rem;
      color: var(--brand-primary);
      letter-spacing: -.01em;
    }

    .card-kicker {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.55);
      color: #7a5c00;
      font-size: .76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .card-body {
      padding: 20px 22px;
    }

    .soft-note {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcfd;
      color: var(--text-soft);
      line-height: 1.7;
      font-size: .93rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf1f4;
      text-align: left;
      vertical-align: top;
      font-size: .92rem;
    }

    th {
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-soft);
      font-weight: 700;
      background: #f8fafc;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: .76rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.included {
      background: var(--success-soft);
      color: var(--success-text);
    }

    .pill.extra {
      background: var(--warning-soft);
      color: var(--warning-text);
    }

    .hotel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .hotel-card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfd 100%);
      border-radius: 18px;
      padding: 16px;
    }

    .hotel-card h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--brand-primary);
      font-family: 'Montserrat', sans-serif;
    }

    .hotel-card p {
      margin: 6px 0;
      font-size: .91rem;
      line-height: 1.55;
      color: #475467;
    }

    .list-clean {
      margin: 0;
      padding-left: 18px;
    }

    .list-clean li {
      margin-bottom: 10px;
      line-height: 1.65;
      color: #475467;
    }

    .verify-card {
      display: grid;
      gap: 14px;
      text-align: center;
    }

    .verify-card img.qr {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin: 0 auto;
      padding: 8px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
    }

    .verify-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
      color: var(--brand-primary);
      margin: 0;
    }

    .verify-copy {
      color: var(--text-soft);
      line-height: 1.65;
      font-size: .92rem;
    }

    .agent-box {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: linear-gradient(180deg, #fff 0%, #fbfcfd 100%);
    }

    .agent-box .label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-soft);
      font-size: .78rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: .05em;
    }

    .agent-box .name {
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--brand-primary);
      margin-bottom: 6px;
    }

    .agent-box .phone {
      font-weight: 700;
      color: #344054;
    }

    .pay-stack {
      display: grid;
      gap: 14px;
    }

    .pay-card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #fbfbfd 100%);
      border-radius: 18px;
      padding: 18px;
    }

    .pay-card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      color: var(--brand-primary);
      font-family: 'Montserrat', sans-serif;
    }

    .pay-card p {
      margin: 0 0 12px;
      color: var(--text-soft);
      line-height: 1.65;
      font-size: .92rem;
    }

    .amounts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .amount-pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      font-size: .88rem;
      font-weight: 700;
      color: var(--brand-primary);
    }

    .pay-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      border-radius: 14px;
      background: var(--brand-primary);
      color: white;
      text-decoration: none;
      font-weight: 700;
      transition: .2s ease;
    }

    .pay-link:hover {
      opacity: .95;
      transform: translateY(-1px);
    }

    .empty-state {
      background: white;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      text-align: center;
      padding: 90px 20px;
    }

    .empty-state h1 {
      margin: 0 0 10px;
      font-family: 'Montserrat', sans-serif;
      color: var(--brand-primary);
    }

    .empty-state p {
      color: var(--text-soft);
    }

    .back-home {
      display: inline-flex;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 14px;
      background: var(--brand-primary);
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .print-voucher {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .pv-top {
      display: grid;
      grid-template-columns: 320px 1fr 130px;
      gap: 24px;
      margin-bottom: 16px;
      align-items: start;
    }

    .pv-logo {
      text-align: center;
    }

    .pv-logo img {
      width: 319px;
      max-width: 100%;
      display: block;
      margin: 0 auto 10px;
    }

    .pv-logo .subcopy {
      width: 319px;
      max-width: 100%;
      color: #7b7b7b;
      line-height: 1.42;
      font-size: 13px;
      margin: 0 auto 10px;
      text-align: center;
    }

    .pv-logo .contact {
      width: 319px;
      max-width: 100%;
      text-align: center;
      color: #253b2f;
      font-size: 12.5px;
      line-height: 1.5;
      margin: 0 auto;
    }

    .pv-head-right {
      text-align: center;
      align-self: center;
    }

    .pv-head-right .date {
      color: #7b7b7b;
      font-size: 1.26rem;
      font-weight: 700;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    .pv-head-right .title {
      color: #253b2f;
      font-size: 2rem;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 12px;
      white-space: nowrap;
    }

    .pv-code {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #d7dbe0;
      border-radius: 12px;
      padding: 10px 16px;
      min-width: 240px;
      text-align: center;
    }

    .pv-code span {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #667085;
      margin-bottom: 4px;
    }

    .pv-code strong {
      font-size: 1.15rem;
      font-family: 'Montserrat', sans-serif;
      letter-spacing: .08em;
    }

    .pv-qr {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pv-qr img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border: 1px solid #d8dde3;
      padding: 6px;
      background: white;
    }

    .pv-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px 18px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .pv-meta-box {
      border: 1px solid #d8dde3;
      padding: 8px 10px;
      min-height: 58px;
    }

    .pv-meta-box strong {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      color: #667085;
      margin-bottom: 4px;
    }

    .pv-section-title {
      margin-top: 14px;
      background: var(--section-title-bg);
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: .04em;
      border: 1px solid #d8dde3;
    }

    .pv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .pv-table th,
    .pv-table td {
      border: 1px solid #d8dde3;
      padding: 7px 8px;
      vertical-align: top;
    }

    .pv-table th {
      background: #fafafa;
    }

    .pv-hotels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 8px;
    }

    .pv-hotel {
      border: 1px solid #d8dde3;
      min-height: 180px;
      padding: 10px;
      background: #fff;
      font-size: 13px;
      line-height: 1.5;
    }

    .pv-bottom {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 14px;
      margin-top: 12px;
    }

    .pv-box {
      border: 1px solid #d8dde3;
      padding: 12px;
      min-height: 210px;
      font-size: 13px;
      line-height: 1.6;
    }

    .pv-assist {
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 10px;
      text-align: center;
    }

    .pv-assist .agent {
      width: 100%;
      border: 1px solid #d8dde3;
      background: #fafafa;
      padding: 10px;
      font-weight: 800;
    }

    .pv-assist .phone {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .pv-assist .qr img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      border: 1px solid #d8dde3;
      padding: 6px;
      background: white;
    }

    @media (max-width: 1200px) {
      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .voucher-content {
        grid-template-columns: 1fr;
      }

      .pv-top {
        grid-template-columns: 1fr;
      }

      .pv-meta {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 900px) {
      .voucher-top {
        grid-template-columns: 1fr;
      }

      .voucher-head {
        flex-direction: column;
      }

      .voucher-brand {
        align-items: center;
      }

      .voucher-brand .subcopy,
      .voucher-brand .contact {
        text-align: center;
      }
    }

    @media (max-width: 640px) {
      .voucher-page {
        padding: 95px 0 40px;
      }

      .voucher-top,
      .summary-grid,
      .voucher-content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .card-head,
      .card-body {
        padding-left: 16px;
        padding-right: 16px;
      }

      .top-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .top-actions-right {
        width: 100%;
        flex-direction: column;
      }

      .action-btn {
        width: 100%;
      }

      .lang-switcher {
        justify-content: space-between;
      }

      .voucher-head .date,
      .voucher-head .title,
      .pv-head-right .date,
      .pv-head-right .title {
        white-space: normal;
      }

      .voucher-qr img {
        width: 108px;
        height: 108px;
      }
    }

    @media print {
      body { background: white; }
      #header-container, #footer-container, .wa-float, .top-actions, .voucher-web { display: none !important; }
      .voucher-page { background: white !important; padding: 0 !important; min-height: auto !important; }
      .voucher-shell { max-width: none; padding: 0; }
      .print-voucher { display: block !important; }

      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <a class="wa-float" href="https://wa.me/51900608980" target="_blank" rel="noopener" aria-label="WhatsApp">
    <img src="./assets/img/logos/LogoWhatsapp.png" alt="WhatsApp" />
  </a>

  <main class="voucher-page">
    <div class="voucher-shell">
      <div class="top-actions">
        <div class="lang-switcher">
          <label for="languageSelect" id="langLabel">Idioma</label>
          <select id="languageSelect">
            <option value="es">ES</option>
            <option value="en">EN</option>
          </select>
        </div>

        <div class="top-actions-right">
          <button class="action-btn secondary" onclick="window.location.href='./mi-reserva.html'" id="backBtn">
            <i class="fa-solid fa-arrow-left"></i> Volver
          </button>
          <button class="action-btn primary" onclick="window.print()" id="printBtn">
            <i class="fa-solid fa-print"></i> Imprimir voucher
          </button>
        </div>
      </div>

      <section id="voucherWeb" class="voucher-web" style="display:none;"></section>

    async function loadComponent(componentName, targetId) {
      try {
        const componentPath = `${BASE_PATH}components/${componentName}.html`;
        const response = await fetch(componentPath);
        if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);
        const html = await response.text();
        const target = document.getElementById(targetId);
        if (target) {
          target.innerHTML = html;
          fixImagePaths(target);
        }
      } catch (error) {
        console.error(`Error cargando ${componentName}:`, error);
      }
    }

    function fixImagePaths(container) {
      const images = container.querySelectorAll('img[src*="assets/"]');
      images.forEach(img => {
        const currentSrc = img.getAttribute('src');
        if (currentSrc.startsWith('assets/')) {
          img.setAttribute('src', `.${currentSrc}`);
        }
      });
    }

    async function initializeSharedComponents() {
      await Promise.all([
        loadComponent('header', 'header-container'),
        loadComponent('footer', 'footer-container')
      ]);
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function moneyPen(value) {
      if (value === undefined || value === null || value === "") return null;
      return `S/ ${Number(value).toFixed(2)}`;
    }

    function moneyUsd(value) {
      if (value === undefined || value === null || value === "") return null;
      return `USD ${Number(value).toFixed(2)}`;
    }

    function buildAmountPills(item) {
      const pills = [];
      const pen = moneyPen(item.montoPen);
      const usd = moneyUsd(item.montoUsd);
      if (pen) pills.push(`<span class="amount-pill">${pen}</span>`);
      if (usd) pills.push(`<span class="amount-pill">${usd}</span>`);
      return pills.join("");
    }

    function buildVerificationUrl(reserva) {
      const params = new URLSearchParams({
        codigo: reserva.codigo || "",
        titular: reserva.titularReserva || "",
        fecha: reserva.fechaViaje || reserva.fechaVoucher || ""
      });
      return `${window.location.origin}${window.location.pathname.replace('detalle-reserva.html', 'verificar-reserva.html')}?${params.toString()}`;
    }

    function buildQrUrl(text) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(text)}`;
    }

    function formatDateLocalized(input, lang = "es") {
      if (!input) return i18n[lang].noData;

      const normalized = String(input).trim();

      const isoMatch = normalized.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      const slashMatch = normalized.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);

      let date;

      if (isoMatch) {
        date = new Date(`${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}T12:00:00`);
      } else if (slashMatch) {
        date = new Date(`${slashMatch[3]}-${slashMatch[2]}-${slashMatch[1]}T12:00:00`);
      } else {
        const tentative = new Date(normalized);
        if (!Number.isNaN(tentative.getTime())) {
          date = tentative;
        } else {
          return normalized;
        }
      }

      const locale = lang === "en" ? "en-US" : "es-PE";
      const formatted = date.toLocaleDateString(locale, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      if (lang === "es") {
        return formatted.charAt(0).toUpperCase() + formatted.slice(1);
      }
      return formatted;
    }

    function getLocalizedField(field, lang) {
      if (field == null) return "";
      if (typeof field === "object" && !Array.isArray(field)) {
        return field[lang] || field.es || field.en || "";
      }
      return field;
    }

          </div>

          <div class="pv-head-right">
            <div class="date">${esc(formatDateLocalized(reserva.fechaViaje || reserva.fechaVoucher || reserva.fechaEmision || "", currentLanguage))}</div>
            <div class="title">${esc(t.travelVoucher)}</div>
            <div class="pv-code">
              <span>${esc(t.bookingCode)}</span>
              <strong>${esc(reserva.codigo || t.noData)}</strong>
            </div>
          </div>

          <div class="pv-qr">
            <img src="${qrUrl}" alt="QR">
          </div>
        </div>

        <div class="pv-meta">
          <div class="pv-meta-box"><strong>${esc(t.holder)}</strong>${esc(reserva.titularReserva || t.noData)}</div>
          <div class="pv-meta-box"><strong>${esc(t.travelDate)}</strong>${esc(formatDateLocalized(reserva.fechaViaje || reserva.fechaEmision || "", currentLanguage))}</div>
          <div class="pv-meta-box"><strong>${esc(t.destination)}</strong>${esc(reserva.destino || t.noData)}</div>
          <div class="pv-meta-box"><strong>${esc(t.pack)}</strong>${esc(reserva.packTour || t.noData)}</div>
          <div class="pv-meta-box"><strong>${esc(t.passengersCount)}</strong>${esc(reserva.cantidadPaxs || turistas.length || t.noData)}</div>
          <div class="pv-meta-box"><strong>${esc(t.language)}</strong>${esc(reserva.idioma || t.noData)}</div>
          <div class="pv-meta-box"><strong>${esc(t.phone)}</strong>${esc(reserva.telefonoContacto || t.noData)}</div>
          <div class="pv-meta-box"><strong>${esc(t.coupon)}</strong>${esc(reserva.codigoCupon || t.noData)}</div>
        </div>

        <div class="pv-section-title">${esc(t.printPassengers)}</div>
        <table class="pv-table">
          <thead>
            <tr>
              <th>Nombre completo</th>
              <th>${esc(t.document)}</th>
              <th>${esc(t.nationality)}</th>
              <th>${esc(t.birthDate)}</th>
            </tr>
          </thead>
          <tbody>
            ${turistas.map(turista => `
              <tr>
                <td>${esc(turista.nombreCompleto || `${turista.nombres || ""} ${turista.apellidos || ""}`.trim() || t.noData)}</td>
                <td>${esc(turista.tipoDocumento || t.noData)} ${turista.numeroDocumento || turista.documento ? `- ${esc(turista.numeroDocumento || turista.documento)}` : ""}</td>
                <td>${esc(turista.nacionalidad || t.noData)}</td>
                <td>${esc(turista.fechaNacimiento || t.noData)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        ${hoteles.length ? `
          <div class="pv-section-title">${esc(t.printLodging)}</div>
          <div class="pv-hotels">
            ${hoteles.map(h => `
              <div class="pv-hotel">
                <strong>${esc(h.nombre || t.noData)}</strong><br>
                Ubicación: ${esc(h.ubicacion || t.noData)}<br>
                Check-in: ${esc(h.checkIn || t.noData)}<br>
                Check-out: ${esc(h.checkOut || t.noData)}<br>
                Noches: ${esc(h.noches || t.noData)}<br>
                Habitación: ${esc(h.habitacion || t.noData)}<br>
                Categoría: ${esc(h.categoria || t.noData)}
              </div>
            `).join("")}
          </div>
        ` : ""}

        <div class="pv-section-title">${esc(t.printServices)}</div>
        <table class="pv-table">
          <thead>
            <tr>
              <th>${esc(t.code)}</th>
              <th>${esc(t.service)}</th>
              <th>${esc(t.date)}</th>
              <th>${esc(t.start)}</th>
              <th>${esc(t.end)}</th>
              <th>${esc(t.status)}</th>
            </tr>
          </thead>
          <tbody>
            ${servicios.map(s => `
              <tr>
                <td>${esc(s.codigo || t.noData)}</td>
                <td>${esc(getLocalizedField(s.nombre, currentLanguage) || t.noData)}</td>
                <td>${esc(s.fecha || t.noData)}</td>
                <td>${esc(s.horaInicio || t.noData)}</td>
                <td>${esc(s.horaFin || t.noData)}</td>
                <td>${s.incluido ? esc(t.included) : esc(t.extra)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        ${vuelos.length ? `
          <div class="pv-section-title">${esc(t.printTransfers)}</div>
          <table class="pv-table">
            <thead>
              <tr>
                <th>${esc(t.operator)}</th>
                <th>${esc(t.number)}</th>
                <th>${esc(t.origin)}</th>
                <th>${esc(t.destination)}</th>
                <th>${esc(t.start)}</th>
                <th>${esc(t.arrival)}</th>
              </tr>
            </thead>
            <tbody>
              ${vuelos.map(v => `
                <tr>
                  <td>${esc(v.operador || t.noData)}</td>
                  <td>${esc(v.numero || t.noData)}</td>
                  <td>${esc(v.origen || t.noData)}</td>
                  <td>${esc(v.destino || t.noData)}</td>
                  <td>${esc(v.salida || t.noData)}</td>
                  <td>${esc(v.llegada || t.noData)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        ` : ""}

        <div class="pv-section-title">${esc(t.printAdditionalInfo)}</div>
        <div class="pv-bottom">
          <div class="pv-box">
            ${infoAdicional.length ? infoAdicional.map(i => `• ${esc(getLocalizedField(i, currentLanguage) || t.noData)}`).join("<br>") : ""}
            ${noIncluye.length ? `<br><br><strong>${esc(t.notIncludes)}:</strong><br>${noIncluye.map(i => `• ${esc(getLocalizedField(i, currentLanguage) || t.noData)}`).join("<br>")}` : ""}
            ${(pagoTotal || pagosExtras.length) ? `<br><br><strong>${esc(t.pendingPayments)}:</strong><br>` : ""}
            ${pagoTotal ? `• ${esc(getLocalizedField(pagoTotal.label, currentLanguage) || t.completePayment)} — ${esc(moneyPen(pagoTotal.montoPen) || "")} ${esc(moneyUsd(pagoTotal.montoUsd) || "")}<br>` : ""}
            ${pagosExtras.map(p => `• ${esc(getLocalizedField(p.label, currentLanguage) || t.goToPayment)} — ${esc(moneyPen(p.montoPen) || "")} ${esc(moneyUsd(p.montoUsd) || "")}`).join("<br>")}
          </div>

          <div class="pv-box pv-assist">
            <div class="agent">${esc(reserva.agenteAsignado || t.noData)}</div>
            <div class="phone">${esc(reserva.agenteTelefono || t.noData)}</div>
            <div class="qr"><img src="${qrUrl}" alt="QR"></div>
          </div>
        </div>
      `;
    }

    function initVoucher() {
      const reservaRaw = localStorage.getItem("reservaSeleccionada");
      const webEl = document.getElementById("voucherWeb");
      const emptyEl = document.getElementById("voucherEmpty");
      const printEl = document.getElementById("voucherPrint");

      applyStaticTranslations();

      if (!reservaRaw) {
        emptyEl.style.display = "block";
        return;
      }

      try {
        const reserva = JSON.parse(reservaRaw);
        webEl.innerHTML = renderWebVoucher(reserva);
        printEl.innerHTML = renderPrintVoucher(reserva);
        webEl.style.display = "block";
        emptyEl.style.display = "none";
      } catch (error) {
        console.error("Error leyendo reserva:", error);
        emptyEl.style.display = "block";
      }
    }

    function setupLanguageSwitcher() {
      const select = document.getElementById("languageSelect");
      select.value = currentLanguage;

      select.addEventListener("change", (e) => {
        currentLanguage = e.target.value;
        localStorage.setItem("voucherLanguage", currentLanguage);
        initVoucher();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', async () => {
        await initializeSharedComponents();
        setupLanguageSwitcher();
        initVoucher();
      });
    } else {
      initializeSharedComponents().then(() => {
        setupLanguageSwitcher();
        initVoucher();
      });
    }
  </script>

  <script src="./assets/js/components/header.js"></script>
  <script src="./assets/js/lib/utils.js"></script>
</body>
</html>
