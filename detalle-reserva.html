<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de Reserva | MyCuscoTrip</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <link rel="stylesheet" href="./assets/css/main.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/header.css">
  <link rel="stylesheet" href="./assets/css/footer.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">

  <style>
    :root {
      --brand-green: #4c6b2f;
      --brand-dark: #24351b;
      --brand-gold: #e8cf86;
      --brand-blue: #9dbcf3;
      --line: #cfcfcf;
      --soft-bg: #f5f5f5;
      --text: #222;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f2f4f5;
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
    }

    .voucher-page {
      padding: 120px 0 70px;
      background:
        linear-gradient(rgba(4, 31, 21, .78), rgba(4, 31, 21, .78)),
        url("./assets/img/reserva/machu-picchu-fondo.jpg") center/cover no-repeat fixed;
      min-height: 100vh;
    }

    .voucher-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-weight: 700;
      cursor: pointer;
      font-size: .95rem;
    }

    .action-btn.primary {
      background: #053220;
      color: white;
    }

    .action-btn.secondary {
      background: white;
      color: #053220;
    }

    .voucher-web {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.18);
    }

    .web-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #053220;
      color: white;
    }

    .web-header-left {
      padding: 34px 30px;
    }

    .web-header-left img {
      max-width: 220px;
      height: auto;
      display: block;
      margin-bottom: 16px;
    }

    .web-header-left p {
      margin: 7px 0;
      line-height: 1.6;
      color: rgba(255,255,255,.92);
    }

    .web-header-right {
      padding: 34px 30px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      background: #0b3b27;
    }

    .web-header-right .date {
      font-size: 1.2rem;
      font-weight: 700;
      color: #d7d7d7;
      margin-bottom: 8px;
      text-align: right;
    }

    .web-header-right .title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 800;
      color: var(--brand-blue);
      margin-bottom: 14px;
      text-align: right;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 24px 28px;
      background: #fafaf8;
      border-bottom: 1px solid #ececec;
    }

    .meta-item {
      background: white;
      border: 1px solid #ececec;
      border-radius: 14px;
      padding: 12px 14px;
    }

    .meta-item .label {
      display: block;
      margin-bottom: 5px;
      font-size: .8rem;
      color: #6b7280;
      font-weight: 700;
      text-transform: uppercase;
    }

    .meta-item .value {
      font-weight: 700;
      line-height: 1.5;
    }

    .web-content {
      padding: 24px 28px 30px;
      display: grid;
      gap: 24px;
    }

    .section-card {
      border: 1px solid #ececec;
      border-radius: 18px;
      overflow: hidden;
      background: white;
    }

    .section-title {
      background: var(--brand-gold);
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      padding: 10px 14px;
      font-size: .95rem;
    }

    .section-body {
      padding: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #e7e7e7;
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
      font-size: .92rem;
    }

    th {
      background: #f6f6f6;
      font-size: .82rem;
      text-transform: uppercase;
    }

    .hotel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .hotel-box {
      border: 1px solid #ddd;
      background: #fcfcfc;
      padding: 12px;
      min-height: 210px;
      line-height: 1.55;
      font-size: .9rem;
    }

    .hotel-box strong {
      color: #1f2937;
    }

    .two-cols {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
    }

    .info-box {
      border: 1px dashed #bbb;
      padding: 14px;
      line-height: 1.65;
      min-height: 230px;
      background: #fff;
      font-size: .93rem;
    }

    .agent-box {
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .agent-contact {
      border: 2px solid #82a96f;
      padding: 12px;
      text-align: center;
      font-weight: 800;
      background: #f9fff6;
    }

    .qr-box {
      display: grid;
      justify-items: center;
      gap: 10px;
      padding: 10px 0;
    }

    .qr-box img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      background: white;
      padding: 8px;
      border: 1px solid #ddd;
    }

    .verify-text {
      text-align: center;
      font-size: .9rem;
      color: #4c6b2f;
      font-weight: 700;
    }

    .pay-stack {
      display: grid;
      gap: 12px;
    }

    .pay-card {
      border: 1px solid #e9ecef;
      background: linear-gradient(180deg, #ffffff 0%, #faf8f2 100%);
      border-radius: 16px;
      padding: 16px;
    }

    .pay-card h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      color: #053220;
      font-family: 'Montserrat', sans-serif;
    }

    .pay-card p {
      margin: 0 0 10px;
      color: #667085;
      line-height: 1.6;
      font-size: .92rem;
    }

    .amounts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .amount-pill {
      display: inline-flex;
      align-items: center;
      background: #f6f7f9;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: .88rem;
      font-weight: 700;
    }

    .pay-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      border-radius: 12px;
      background: #053220;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .print-voucher {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .pv-top {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 22px;
      align-items: start;
      margin-bottom: 14px;
    }

    .pv-logo img {
      width: 230px;
      max-width: 100%;
      display: block;
      margin-bottom: 10px;
    }

    .pv-logo p {
      margin: 6px 0;
      font-size: 13px;
      color: #5a6d3c;
      line-height: 1.45;
    }

    .pv-head-right {
      text-align: center;
    }

    .pv-head-right .date {
      color: #8a8a8a;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .pv-head-right .title {
      color: #9dbcf3;
      font-size: 2.55rem;
      font-weight: 800;
      font-family: 'Montserrat', sans-serif;
      margin-bottom: 10px;
    }

    .pv-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 20px;
      text-align: left;
      font-size: 13px;
    }

    .pv-meta div strong {
      display: inline-block;
      min-width: 130px;
    }

    .pv-section-title {
      margin-top: 14px;
      background: var(--brand-gold);
      padding: 6px 10px;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
    }

    .pv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 0;
    }

    .pv-table th,
    .pv-table td {
      border: 1px solid #d1d1d1;
      padding: 7px 8px;
      vertical-align: top;
    }

    .pv-table th {
      background: #efefef;
    }

    .pv-hotels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 8px;
    }

    .pv-hotel {
      border: 1px solid #d1d1d1;
      min-height: 190px;
      padding: 10px;
      background: #fafafa;
      font-size: 13px;
      line-height: 1.5;
    }

    .pv-bottom {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      margin-top: 10px;
    }

    .pv-box {
      border: 1px dashed #bdbdbd;
      padding: 12px;
      min-height: 220px;
      font-size: 13px;
      line-height: 1.6;
    }

    .pv-assist {
      display: grid;
      justify-items: center;
      align-content: start;
      gap: 10px;
      text-align: center;
    }

    .pv-assist .agent {
      width: 100%;
      border: 2px solid #7ea46d;
      background: #f7fff3;
      padding: 10px;
      font-weight: 800;
    }

    .pv-assist .phone {
      font-size: 1.2rem;
      font-weight: 800;
      color: #1f4f17;
    }

    .pv-assist .qr img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border: 1px solid #ccc;
      padding: 6px;
      background: white;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #475467;
      background: white;
      border-radius: 28px;
    }

    .empty-state h1 {
      font-family: 'Montserrat', sans-serif;
      color: #053220;
    }

    .back-home {
      display: inline-flex;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 12px;
      background: #053220;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 1100px) {
      .web-header,
      .two-cols,
      .pv-top,
      .pv-bottom {
        grid-template-columns: 1fr;
      }

      .hotel-grid,
      .pv-hotels {
        grid-template-columns: 1fr;
      }

      .pv-meta,
      .meta-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body { background: white; }
      #header-container, #footer-container, .wa-float, .top-actions, .voucher-web { display: none !important; }
      .voucher-page { background: white !important; padding: 0 !important; min-height: auto !important; }
      .voucher-shell { max-width: none; padding: 0; }
      .print-voucher { display: block !important; }

      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <a class="wa-float" href="https://wa.me/51900608980" target="_blank" rel="noopener" aria-label="WhatsApp">
    <img src="./assets/img/logos/LogoWhatsapp.png" alt="WhatsApp" />
  </a>

  <main class="voucher-page">
    <div class="voucher-shell">
      <div class="top-actions">
        <button class="action-btn secondary" onclick="window.location.href='./mi-reserva.html'">
          <i class="fa-solid fa-arrow-left"></i> Volver
        </button>
        <button class="action-btn primary" onclick="window.print()">
          <i class="fa-solid fa-print"></i> Imprimir voucher
        </button>
      </div>

      <section id="voucherWeb" class="voucher-web" style="display:none;"></section>
      <section id="voucherEmpty" class="empty-state" style="display:none;">
        <h1>Reserva no encontrada</h1>
        <p>No hay una reserva cargada para mostrar.</p>
        <a href="./mi-reserva.html" class="back-home">Ir a Mi Reserva</a>
      </section>

      <section id="voucherPrint" class="print-voucher"></section>
    </div>
  </main>

  <div id="footer-container"></div>

  <script>
    const IS_GITHUB_PAGES = window.location.hostname.includes('github.io');
    const BASE_PATH = IS_GITHUB_PAGES ? '/mycuscotrip/' : '/';

    async function loadComponent(componentName, targetId) {
      try {
        const componentPath = `${BASE_PATH}components/${componentName}.html`;
        const response = await fetch(componentPath);
        if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);
        const html = await response.text();
        const target = document.getElementById(targetId);
        if (target) {
          target.innerHTML = html;
          fixImagePaths(target);
        }
      } catch (error) {
        console.error(`Error cargando ${componentName}:`, error);
      }
    }

    function fixImagePaths(container) {
      const images = container.querySelectorAll('img[src*="assets/"]');
      images.forEach(img => {
        const currentSrc = img.getAttribute('src');
        if (currentSrc.startsWith('assets/')) {
          img.setAttribute('src', `.${currentSrc}`);
        }
      });
    }

    async function initializeSharedComponents() {
      await Promise.all([
        loadComponent('header', 'header-container'),
        loadComponent('footer', 'footer-container')
      ]);
    }

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function moneyPen(value) {
      if (value === undefined || value === null || value === "") return null;
      return `S/ ${Number(value).toFixed(2)}`;
    }

    function moneyUsd(value) {
      if (value === undefined || value === null || value === "") return null;
      return `USD ${Number(value).toFixed(2)}`;
    }

    function buildAmountPills(item) {
      const pills = [];
      const pen = moneyPen(item.montoPen);
      const usd = moneyUsd(item.montoUsd);
      if (pen) pills.push(`<span class="amount-pill">${pen}</span>`);
      if (usd) pills.push(`<span class="amount-pill">${usd}</span>`);
      return pills.join("");
    }

    function buildVerificationUrl(reserva) {
      const params = new URLSearchParams({
        codigo: reserva.codigo || "",
        titular: reserva.titularReserva || "",
        fecha: reserva.fechaViaje || reserva.fechaVoucher || ""
      });
      return `${window.location.origin}${window.location.pathname.replace('detalle-reserva.html', 'verificar-reserva.html')}?${params.toString()}`;
    }

    function buildQrUrl(text) {
      return `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(text)}`;
    }

    function renderWebVoucher(reserva) {
      const turistas = Array.isArray(reserva.turistas) ? reserva.turistas : [];
      const hoteles = Array.isArray(reserva.hotelInfo) ? reserva.hotelInfo : [];
      const servicios = Array.isArray(reserva.servicios) ? reserva.servicios : [];
      const vuelos = Array.isArray(reserva.vuelos) ? reserva.vuelos : [];
      const noIncluye = Array.isArray(reserva.noIncluye) ? reserva.noIncluye : [];
      const infoAdicional = Array.isArray(reserva.informacionAdicional) ? reserva.informacionAdicional : [];
      const pagosExtras = reserva.pagos && Array.isArray(reserva.pagos.extras) ? reserva.pagos.extras : [];
      const pagoTotal = reserva.pagos && reserva.pagos.totalPendiente ? reserva.pagos.totalPendiente : null;

      const verificationUrl = buildVerificationUrl(reserva);
      const qrUrl = buildQrUrl(verificationUrl);

      return `
        <div class="web-header">
          <div class="web-header-left">
            <img src="./assets/img/reserva/logo-color.png" alt="My Cusco Trip">
            <p>Especialistas diseñando viajes llenos de emociones al Valle Sagrado de los Incas</p>
            <p>Av. Ejército 1630 - Cusco</p>
            <p>Phone:(51) 231-1303 / 084-643003</p>
            <p>reservas@mycuscotrip.com</p>
            <p>www.mycuscotrip.com</p>
          </div>

          <div class="web-header-right">
            <div class="date">${esc(reserva.fechaVoucher || reserva.fechaEmision || "")}</div>
            <div class="title">TRAVEL VOUCHER</div>
          </div>
        </div>

        <div class="meta-grid">
          <div class="meta-item"><span class="label">Cod. Reserva</span><div class="value">${esc(reserva.codigo)}</div></div>
          <div class="meta-item"><span class="label">Idioma</span><div class="value">${esc(reserva.idioma || "-")}</div></div>
          <div class="meta-item"><span class="label">Titular reserva</span><div class="value">${esc(reserva.titularReserva || "-")}</div></div>
          <div class="meta-item"><span class="label">Fecha emisión</span><div class="value">${esc(reserva.fechaEmision || "-")}</div></div>
          <div class="meta-item"><span class="label">Telf. contacto</span><div class="value">${esc(reserva.telefonoContacto || "-")}</div></div>
          <div class="meta-item"><span class="label">Cod. cupón</span><div class="value">${esc(reserva.codigoCupon || "-")}</div></div>
          <div class="meta-item"><span class="label">Cant. paxs</span><div class="value">${esc(reserva.cantidadPaxs || turistas.length || "-")}</div></div>
          <div class="meta-item"><span class="label">Destino</span><div class="value">${esc(reserva.destino || "-")}</div></div>
          <div class="meta-item"><span class="label">Pack tour</span><div class="value">${esc(reserva.packTour || "-")}</div></div>
          <div class="meta-item"><span class="label">Agente asignado</span><div class="value">${esc(reserva.agenteAsignado || "-")} ${reserva.agenteTelefono ? `<br>${esc(reserva.agenteTelefono)}` : ""}</div></div>
        </div>

        <div class="web-content">
          <section class="section-card">
            <div class="section-title">Nombres de los turistas</div>
            <div class="section-body">
              <table>
                <thead>
                  <tr>
                    <th>Nombre completo</th>
                    <th>Edad</th>
                    <th>Documento</th>
                    <th>País</th>
                  </tr>
                </thead>
                <tbody>
                  ${turistas.map(t => `
                    <tr>
                      <td>${esc(t.nombreCompleto || `${t.nombres || ""} ${t.apellidos || ""}`.trim())}</td>
                      <td>${esc(t.edad || "-")}</td>
                      <td>${esc(t.tipoDocumento || "")} ${t.numeroDocumento || t.documento ? ` - ${esc(t.numeroDocumento || t.documento)}` : ""}</td>
                      <td>${esc(t.nacionalidad || "-")}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </section>

          ${hoteles.length ? `
          <section class="section-card">
            <div class="section-title">Información de hoteles</div>
            <div class="section-body">
              <div class="hotel-grid">
                ${hoteles.map(h => `
                  <div class="hotel-box">
                    <div><strong>Nombre Hotel:</strong> ${esc(h.nombre || "-")}</div>
                    <div><strong>Ubicación:</strong> ${esc(h.ubicacion || "-")}</div>
                    <div><strong>Check-in:</strong> ${esc(h.checkIn || "-")}</div>
                    <div><strong>Check-out:</strong> ${esc(h.checkOut || "-")}</div>
                    <div><strong>Total Noches:</strong> ${esc(h.noches || "-")} &nbsp; <strong>Categoría:</strong> ${esc(h.categoria || "-")}</div>
                    <div><strong>Tipo Habitación:</strong> ${esc(h.habitacion || "-")}</div>
                    <div><strong>Dirección:</strong> ${esc(h.direccion || "-")}</div>
                    <div><strong>Teléfono:</strong> ${esc(h.telefono || "-")}</div>
                    <div><strong>Obs:</strong> ${esc(h.observaciones || "-")}</div>
                  </div>
                `).join("")}
              </div>
            </div>
          </section>` : ""}

          <section class="section-card">
            <div class="section-title">Servicios turísticos</div>
            <div class="section-body">
              <table>
                <thead>
                  <tr>
                    <th>Código</th>
                    <th>Servicio turístico</th>
                    <th>Fecha</th>
                    <th>Hora inicio</th>
                    <th>Hora fin</th>
                  </tr>
                </thead>
                <tbody>
                  ${servicios.map(s => `
                    <tr>
                      <td>${esc(s.codigo || "-")}</td>
                      <td>${esc(s.nombre || "-")}${!s.incluido ? ' <strong style="color:#b45309;">(Extra / No incluido)</strong>' : ''}</td>
                      <td>${esc(s.fecha || "-")}</td>
                      <td>${esc(s.horaInicio || "-")}</td>
                      <td>${esc(s.horaFin || "-")}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </section>

          ${vuelos.length ? `
          <section class="section-card">
            <div class="section-title">Itinerario de vuelos / buses</div>
            <div class="section-body">
              <table>
                <thead>
                  <tr>
                    <th>Operador</th>
                    <th>Número vuelo</th>
                    <th>Origen</th>
                    <th>Destino</th>
                    <th>Salida</th>
                    <th>Llegada</th>
                  </tr>
                </thead>
                <tbody>
                  ${vuelos.map(v => `
                    <tr>
                      <td>${esc(v.operador || "-")}</td>
                      <td>${esc(v.numero || "-")}</td>
                      <td>${esc(v.origen || "-")}</td>
                      <td>${esc(v.destino || "-")}</td>
                      <td>${esc(v.salida || "-")}</td>
                      <td>${esc(v.llegada || "-")}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </section>` : ""}

          <section class="section-card">
            <div class="section-title">Información adicional</div>
            <div class="section-body">
              <div class="two-cols">
                <div class="info-box">
                  <strong>TENER EN CUENTA:</strong><br>
                  ${infoAdicional.length ? infoAdicional.map(i => `• ${esc(i)}`).join("<br>") : "• Revisa bien las indicaciones de este travel voucher.<br>• Presenta tu documento original en cada servicio."}
                  ${noIncluye.length ? `<br><br><strong>NO INCLUYE:</strong><br>${noIncluye.map(i => `• ${esc(i)}`).join("<br>")}` : ""}
                </div>

                <div class="agent-box">
                  <div class="info-box" style="min-height:auto;">
                    Para toda clase de asistencia durante su viaje puede contactarse con su agente de viajes asignado:
                    <div class="agent-contact" style="margin-top:12px;">
                      ${esc(reserva.agenteAsignado || "-")}<br>
                      ${esc(reserva.agenteTelefono || "-")}
                    </div>
                  </div>

                  <div class="info-box" style="min-height:auto;">
                    <div class="qr-box">
                      <img src="${qrUrl}" alt="QR de verificación">
                      <div class="verify-text">Escanea para verificar esta reserva</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          ${(pagoTotal || pagosExtras.length) ? `
          <section class="section-card">
            <div class="section-title">Pagos pendientes / adicionales</div>
            <div class="section-body">
              <div class="pay-stack">
                ${pagoTotal ? `
                  <div class="pay-card">
                    <h3>${esc(pagoTotal.label || "Completar pago total")}</h3>
                    <p>${esc(pagoTotal.descripcion || "Usa este enlace para completar el pago total de la reserva.")}</p>
                    <div class="amounts">${buildAmountPills(pagoTotal)}</div>
                    ${pagoTotal.url ? `<a class="pay-link" href="${esc(pagoTotal.url)}" target="_blank" rel="noopener">Pagar ahora</a>` : ""}
                  </div>
                ` : ""}

                ${pagosExtras.map(p => `
                  <div class="pay-card">
                    <h3>${esc(p.label || "Pagar servicio extra")}</h3>
                    <p>${esc(p.descripcion || "Pago para servicios adicionales o no incluidos.")}</p>
                    <div class="amounts">${buildAmountPills(p)}</div>
                    ${p.url ? `<a class="pay-link" href="${esc(p.url)}" target="_blank" rel="noopener">Ir al pago</a>` : ""}
                  </div>
                `).join("")}
              </div>
            </div>
          </section>` : ""}
        </div>
      `;
    }

    function renderPrintVoucher(reserva) {
      const turistas = Array.isArray(reserva.turistas) ? reserva.turistas : [];
      const hoteles = Array.isArray(reserva.hotelInfo) ? reserva.hotelInfo : [];
      const servicios = Array.isArray(reserva.servicios) ? reserva.servicios : [];
      const vuelos = Array.isArray(reserva.vuelos) ? reserva.vuelos : [];
      const noIncluye = Array.isArray(reserva.noIncluye) ? reserva.noIncluye : [];
      const infoAdicional = Array.isArray(reserva.informacionAdicional) ? reserva.informacionAdicional : [];
      const pagosExtras = reserva.pagos && Array.isArray(reserva.pagos.extras) ? reserva.pagos.extras : [];
      const pagoTotal = reserva.pagos && reserva.pagos.totalPendiente ? reserva.pagos.totalPendiente : null;

      const verificationUrl = buildVerificationUrl(reserva);
      const qrUrl = buildQrUrl(verificationUrl);

      return `
        <div class="pv-top">
          <div class="pv-logo">
            <img src="./assets/img/reserva/logo-color.png" alt="My Cusco Trip">
            <p>Especialistas diseñando viajes llenos de emociones al Valle Sagrado de los Incas</p>
            <p>Av. Ejército 1630 - Cusco</p>
            <p>Phone:(51) 231-1303 / 084-643003</p>
            <p>reservas@mycuscotrip.com</p>
            <p>www.mycuscotrip.com</p>
          </div>

          <div class="pv-head-right">
            <div class="date">${esc(reserva.fechaVoucher || reserva.fechaEmision || "")}</div>
            <div class="title">TRAVEL VOUCHER</div>
            <div class="pv-meta">
              <div><strong>COD. RESERVA:</strong> ${esc(reserva.codigo || "-")}</div>
              <div><strong>IDIOMA:</strong> ${esc(reserva.idioma || "-")}</div>
              <div><strong>FECHA EMISION:</strong> ${esc(reserva.fechaEmision || "-")}</div>
              <div><strong>TITULAR RESERVA:</strong> ${esc(reserva.titularReserva || "-")}</div>
              <div><strong>TELF. CONTACTO:</strong> ${esc(reserva.telefonoContacto || "-")}</div>
              <div><strong>COD. CUPON:</strong> ${esc(reserva.codigoCupon || "-")}</div>
              <div><strong>CANT. PAXS:</strong> ${esc(reserva.cantidadPaxs || turistas.length || "-")}</div>
              <div><strong>DESTINO:</strong> ${esc(reserva.destino || "-")}</div>
              <div><strong>PACK TOUR:</strong> ${esc(reserva.packTour || "-")}</div>
            </div>
          </div>
        </div>

        <div class="pv-section-title">Nombres de los turistas</div>
        <table class="pv-table">
          <thead>
            <tr>
              <th>Nombres de los turistas</th>
              <th>Edad</th>
              <th>Documento de identificación</th>
              <th>País</th>
            </tr>
          </thead>
          <tbody>
            ${turistas.map(t => `
              <tr>
                <td>${esc(t.nombreCompleto || `${t.nombres || ""} ${t.apellidos || ""}`.trim())}</td>
                <td>${esc(t.edad || "-")}</td>
                <td>${esc(t.tipoDocumento || "-")} ${t.numeroDocumento || t.documento ? ` - ${esc(t.numeroDocumento || t.documento)}` : ""}</td>
                <td>${esc(t.nacionalidad || "-")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        ${hoteles.length ? `
          <div class="pv-section-title">Información de hoteles</div>
          <div class="pv-hotels">
            ${hoteles.map(h => `
              <div class="pv-hotel">
                <strong>Nombre Hotel:</strong> ${esc(h.nombre || "-")}<br>
                <strong>Ubicación:</strong> ${esc(h.ubicacion || "-")}<br>
                <strong>Check-in:</strong> ${esc(h.checkIn || "-")}<br>
                <strong>Check-out:</strong> ${esc(h.checkOut || "-")}<br>
                <strong>Total Noches:</strong> ${esc(h.noches || "-")}<br>
                <strong>Categoría:</strong> ${esc(h.categoria || "-")}<br>
                <strong>Tipo Habitación:</strong> ${esc(h.habitacion || "-")}<br>
                <strong>Dirección:</strong> ${esc(h.direccion || "-")}<br>
                <strong>Teléfono:</strong> ${esc(h.telefono || "-")}<br>
                <strong>Obs:</strong> ${esc(h.observaciones || "-")}
              </div>
            `).join("")}
          </div>
        ` : ""}

        <div class="pv-section-title">Servicios turísticos</div>
        <table class="pv-table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Servicio turístico</th>
              <th>Fecha</th>
              <th>Hora inicio</th>
              <th>Hora fin</th>
            </tr>
          </thead>
          <tbody>
            ${servicios.map(s => `
              <tr>
                <td>${esc(s.codigo || "-")}</td>
                <td>${esc(s.nombre || "-")}${!s.incluido ? ' (Extra / No incluido)' : ''}</td>
                <td>${esc(s.fecha || "-")}</td>
                <td>${esc(s.horaInicio || "-")}</td>
                <td>${esc(s.horaFin || "-")}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>

        ${vuelos.length ? `
          <div class="pv-section-title">Itinerario de vuelos / buses</div>
          <table class="pv-table">
            <thead>
              <tr>
                <th>Operador</th>
                <th>Número vuelo</th>
                <th>Origen</th>
                <th>Destino</th>
                <th>Salida</th>
                <th>Llegada</th>
              </tr>
            </thead>
            <tbody>
              ${vuelos.map(v => `
                <tr>
                  <td>${esc(v.operador || "-")}</td>
                  <td>${esc(v.numero || "-")}</td>
                  <td>${esc(v.origen || "-")}</td>
                  <td>${esc(v.destino || "-")}</td>
                  <td>${esc(v.salida || "-")}</td>
                  <td>${esc(v.llegada || "-")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        ` : ""}

        <div class="pv-section-title">Información adicional</div>
        <div class="pv-bottom">
          <div class="pv-box">
            <strong>TENER EN CUENTA:</strong><br>
            ${infoAdicional.length ? infoAdicional.map(i => `• ${esc(i)}`).join("<br>") : "• Lee bien las indicaciones del travel voucher.<br>• Coordina cambios con tu agente."}
            ${noIncluye.length ? `<br><br><strong>NO INCLUYE:</strong><br>${noIncluye.map(i => `• ${esc(i)}`).join("<br>")}` : ""}
            ${(pagoTotal || pagosExtras.length) ? `<br><br><strong>INFORMACIÓN ADICIONAL:</strong><br>` : ""}
            ${pagoTotal ? `• ${esc(pagoTotal.label || "Completar pago total")} — ${esc(moneyPen(pagoTotal.montoPen) || "")} ${esc(moneyUsd(pagoTotal.montoUsd) || "")}<br>` : ""}
            ${pagosExtras.map(p => `• ${esc(p.label || "Pago extra")} — ${esc(moneyPen(p.montoPen) || "")} ${esc(moneyUsd(p.montoUsd) || "")}`).join("<br>")}
          </div>

          <div class="pv-box pv-assist">
            <div>Para toda clase de asistencia durante su viaje puede contactarse con su agente de viajes asignado:</div>
            <div class="agent">${esc(reserva.agenteAsignado || "-")}<br>${esc(reserva.agenteTelefono || "-")}</div>
            <div class="qr">
              <img src="${qrUrl}" alt="QR verificación">
            </div>
            <div><strong>Escanea para verificar</strong></div>
            <div>¡NOS VAMOS A MACHU PICCHU!</div>
          </div>
        </div>
      `;
    }

    function initVoucher() {
      const reservaRaw = localStorage.getItem("reservaSeleccionada");
      const webEl = document.getElementById("voucherWeb");
      const emptyEl = document.getElementById("voucherEmpty");
      const printEl = document.getElementById("voucherPrint");

      if (!reservaRaw) {
        emptyEl.style.display = "block";
        return;
      }

      try {
        const reserva = JSON.parse(reservaRaw);
        webEl.innerHTML = renderWebVoucher(reserva);
        printEl.innerHTML = renderPrintVoucher(reserva);
        webEl.style.display = "block";
      } catch (error) {
        console.error("Error leyendo reserva:", error);
        emptyEl.style.display = "block";
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', async () => {
        await initializeSharedComponents();
        initVoucher();
      });
    } else {
      initializeSharedComponents().then(initVoucher);
    }
  </script>

  <script src="./assets/js/components/header.js"></script>
  <script src="./assets/js/lib/utils.js"></script>
</body>
</html>
