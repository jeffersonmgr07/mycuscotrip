<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verificación de cuenta | My Cusco Trip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="./assets/js/config.js?v=56"></script>
  <style>
    :root{--mct-green:#062803;--mct-soft:#f4f8f4;--mct-border:#dfe8df}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:linear-gradient(rgba(6,40,3,.72),rgba(6,40,3,.72)),url('./assets/img/quote/fallbacks/machu-picchu.jpg') center/cover no-repeat;display:grid;place-items:center;color:#17301b;padding:24px}
    .verify-card{width:min(560px,100%);background:#fff;border:1px solid var(--mct-border);border-radius:28px;padding:34px 28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.24)}
    .verify-icon{width:64px;height:64px;border-radius:999px;background:#eef7ef;display:grid;place-items:center;margin:0 auto 18px;color:var(--mct-green);font-size:30px}
    .spinner{width:34px;height:34px;border:4px solid #dfe8df;border-top-color:var(--mct-green);border-radius:999px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{margin:0 0 10px;color:var(--mct-green);font-size:clamp(24px,4vw,32px)}
    p{margin:0 auto 18px;line-height:1.6;color:#516051;max-width:460px}
    a{display:inline-flex;align-items:center;justify-content:center;background:var(--mct-green);color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:13px 22px}
  </style>
</head>
<body>
  <main class="verify-card" id="verifyCard">
    <div class="verify-icon"><span class="spinner" aria-hidden="true"></span></div>
    <h1>Verificando tu cuenta</h1>
    <p>Un momento, por favor...</p>
  </main>

  <script>
    function getApiUrl(){
      return String(window.MCT_HOTEL_MARKETPLACE_APPS_SCRIPT_URL || window.MCT_HOTEL_MARKETPLACE_CONFIG?.appsScriptUrl || '').trim();
    }
    function render(ok, message){
      const card = document.getElementById('verifyCard');
      card.innerHTML = ok ? `
        <div class="verify-icon">✓</div>
        <h1>Cuenta verificada</h1>
        <p>${message || 'Tu cuenta fue activada correctamente. Ya puedes ingresar al panel de administración de hoteles.'}</p>
        <a href="./login-admin-hotel.html">Ingresar al panel</a>
      ` : `
        <div class="verify-icon">!</div>
        <h1>No se pudo verificar</h1>
        <p>${message || 'El enlace no es válido o ya fue utilizado.'}</p>
        <a href="./login-admin-hotel.html">Volver al acceso</a>
      `;
    }

    function verifyViaJsonp(token){
      const API = getApiUrl();
      return new Promise(resolve => {
        if(!API) return resolve({ok:false,error:'No se encontró la URL del Apps Script.'});
        const callbackName = `mctHotelVerify_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement('script');
        let done = false;
        const timer = setTimeout(() => finish({ok:false,error:'No se recibió respuesta del servicio de verificación. Intenta nuevamente.'}), 25000);
        function cleanup(){
          clearTimeout(timer);
          try { delete window[callbackName]; } catch(_) { window[callbackName] = undefined; }
          script.remove();
        }
        function finish(data){
          if(done) return;
          done = true;
          cleanup();
          resolve(data || {ok:false,error:'Respuesta vacía del servicio de verificación.'});
        }
        window[callbackName] = finish;
        const sep = API.includes('?') ? '&' : '?';
        script.src = `${API}${sep}action=verify_owner&token=${encodeURIComponent(token)}&callback=${encodeURIComponent(callbackName)}&_=${Date.now()}`;
        script.onerror = () => finish({ok:false,error:'No se pudo conectar con el servicio de verificación.'});
        document.body.appendChild(script);
      });
    }

    (async function(){
      const token = new URLSearchParams(location.search).get('token') || '';
      if(!token) return render(false, 'El enlace no contiene un token de verificación.');
      const result = await verifyViaJsonp(token);
      render(!!result.ok, result.message || result.error);
    })();
  </script>
</body>
</html>
