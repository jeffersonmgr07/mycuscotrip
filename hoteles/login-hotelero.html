<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login hotelero | My Cusco Trip</title>
  <link rel="icon" href="./assets/img/favicon.ico" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/header.css?v=44" />
  <link rel="stylesheet" href="./assets/css/footer.css" />
  <link rel="stylesheet" href="./assets/css/hoteles.css?v=44" />
</head>
<body>
  <div id="header-container"></div>
  <main class="hotel-marketplace-page">
    <div class="hotel-marketplace-shell">
      <section class="hotel-marketplace-card" style="max-width:620px;margin:auto;">
        <span class="hotels-kicker hotels-kicker--dark"><i class="fa-solid fa-lock"></i> Acceso hotelero</span>
        <h1>Ingresar al panel</h1>
        <p>Panel inicial para administrar alojamientos, tarifas y disponibilidad.</p>
        <form id="hotelOwnerLoginForm" class="hotel-admin-form-grid">
          <label class="full">Correo <input name="email" type="email" required placeholder="correo@hotel.com"></label>
          <label class="full">Contraseña <input name="password" type="password" required placeholder="Contraseña"></label>
          <div class="full hotel-admin-actions">
            <button type="submit" class="hotel-admin-btn"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
            <a href="./registro-hotelero.html" class="hotel-admin-btn hotel-admin-btn--ghost">Crear cuenta hotelera</a>
          </div>
          <p id="hotelOwnerLoginMsg" class="full hotel-inline-alert" hidden></p>
        </form>
      </section>
    </div>
  </main>
  <div id="footer-container"></div>
  <script>
    async function loadComponent(componentName, targetId) {
      try { const response = await fetch(`./components/${componentName}.html`); document.getElementById(targetId).innerHTML = await response.text(); } catch(error) { console.error(error); }
    }
    document.addEventListener('DOMContentLoaded', async () => { await Promise.all([loadComponent('header','header-container'),loadComponent('footer','footer-container')]); window.initMyCuscoTripHeader?.(); });
    window.MCT_HOTEL_MARKETPLACE_APPS_SCRIPT_URL = "";
  </script>
  <script src="./assets/js/components/header.js?v=44"></script>
  <script src="./assets/js/pages/hotel-marketplace.js?v=44"></script>
</body>
</html>
