<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estado de reserva | My Cusco Trip</title>

  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/footer.css" />
  <link rel="stylesheet" href="/assets/css/portal.css" />
</head>
<body data-page="booking-status">
  <div id="headerMount"></div>

  <main class="booking-status-page container">
    <section class="status-login-card">
      <h1 data-i18n="reservationStatus">Estado de reserva</h1>
      <p data-i18n="reservationLookupHelp">
        Ingresa tu código de reserva y apellido.
      </p>

      <form id="reservationLookupForm">
        <div class="field">
          <label data-i18n="reservationCode">Código de reserva</label>
          <input type="text" id="reservationCode" placeholder="CUZA2D4C1" required />
        </div>

        <div class="field">
          <label data-i18n="lastName">Apellido</label>
          <input type="text" id="reservationLastName" required />
        </div>

        <button type="submit" class="btn-primary" data-i18n="checkStatus">
          Consultar
        </button>
      </form>
    </section>

    <section class="status-result" id="reservationStatusResult" hidden>
      <header class="status-result__head">
        <div>
          <small data-i18n="reservationCode">Código de reserva</small>
          <h2 data-reservation-code></h2>
        </div>
        <div>
          <small data-i18n="bookingStatus">Estado</small>
          <strong data-booking-status></strong>
        </div>
      </header>

      <div class="status-countdown">
        <span data-i18n="daysUntilTrip">Días faltantes</span>
        <strong data-days-until-trip></strong>
      </div>

      <div class="status-grid">
        <article class="status-card">
          <h3 data-i18n="tourDetails">Detalles del tour</h3>
          <div data-reservation-tour></div>
        </article>

        <article class="status-card">
          <h3 data-i18n="passengers">Pasajeros</h3>
          <div data-reservation-passengers></div>
        </article>

        <article class="status-card">
          <h3 data-i18n="payment">Pago</h3>
          <div data-reservation-payment></div>
        </article>

        <article class="status-card">
          <h3 data-i18n="extraServices">Servicios adicionales</h3>
          <div data-reservation-services></div>
        </article>
      </div>

      <section class="status-gallery">
        <h3 data-i18n="photos">Fotos</h3>
        <div data-reservation-gallery></div>
      </section>

      <section class="status-actions">
        <button type="button" id="requestChangeBtn" class="btn-secondary" data-i18n="requestChange">
          Solicitar cambio
        </button>
        <button type="button" id="addServiceBtn" class="btn-primary" data-i18n="addService">
          Agregar servicio
        </button>
      </section>
    </section>
  </main>

  <div id="footerMount"></div>

  <script type="module" src="/assets/js/booking-status.js"></script>
</body>
</html>
