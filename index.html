  <script>
    const IS_GITHUB_PAGES = window.location.hostname.includes('github.io');
    const BASE_PATH = IS_GITHUB_PAGES ? '/mycuscotrip/' : '/';

    console.log('Configuración:', { IS_GITHUB_PAGES, BASE_PATH });

    async function loadComponent(componentName, targetId) {
      try {
        const componentPath = `${BASE_PATH}components/${componentName}.html`;
        console.log(`Cargando: ${componentPath}`);

        const response = await fetch(componentPath);

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const html = await response.text();
        const target = document.getElementById(targetId);

        if (target) {
          target.innerHTML = html;
          console.log(`${componentName} cargado en #${targetId}`);
          fixImagePaths(target);
          return true;
        }

        return false;
      } catch (error) {
        console.error(`Error cargando ${componentName}:`, error);

        const target = document.getElementById(targetId);
        if (target) {
          target.innerHTML = getFallbackContent(componentName);
        }

        return false;
      }
    }

    function fixImagePaths(container) {
      const images = container.querySelectorAll('img[src*="assets/"]');

      images.forEach(img => {
        const currentSrc = img.getAttribute('src');

        if (currentSrc.startsWith('assets/')) {
          const newSrc = `./${currentSrc}`;
          img.setAttribute('src', newSrc);
          console.log(`Ruta corregida: ${currentSrc} -> ${newSrc}`);
        }
      });
    }

    function getFallbackContent(componentName) {
      const fallbacks = {
        header: `
          <header style="background:#053220;padding:15px 0;">
            <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
              <div style="color:white;font-weight:bold;font-size:1.2rem;">MyCuscoTrip</div>
              <nav>
                <a href="#home" style="color:white;margin:0 10px;">Home</a>
                <a href="#machu-picchu" style="color:white;margin:0 10px;">Machu Picchu</a>
              </nav>
            </div>
          </header>
        `,
        "search-bar": `
          <div style="background:white;padding:20px;border-radius:10px;margin-top:20px;">
            <div style="text-align:center;color:#666;padding:20px;">
              Barra de búsqueda temporalmente no disponible
            </div>
          </div>
        `,
        footer: `
          <footer style="background:#062803;color:white;padding:40px 0;margin-top:40px;">
            <div class="container">
              <div style="text-align:center;">
                <p>© 2023 MyCuscoTrip</p>
                <p>Especialistas en viajes a Cusco y Machu Picchu</p>
              </div>
            </div>
          </footer>
        `
      };

      return fallbacks[componentName] || `<div>Componente ${componentName} no disponible</div>`;
    }

    function initializeComponents() {
      console.log('Inicializando componentes JS...');

      if (typeof MyCuscoTripHeader === 'function') {
        try {
          new MyCuscoTripHeader();
          console.log('Header JS inicializado');
        } catch (e) {
          console.error('Error en Header JS:', e);
        }
      }

      if (typeof MyCuscoTripSearchBar === 'function' && typeof flatpickr !== 'undefined') {
        setTimeout(() => {
          try {
            new MyCuscoTripSearchBar();
            console.log('SearchBar JS inicializado');
          } catch (e) {
            console.error('Error en SearchBar JS:', e);
          }
        }, 500);
      }

      if (typeof MyCuscoTripProducts === 'function') {
        try {
          new MyCuscoTripProducts();
          console.log('Products JS inicializado');
        } catch (e) {
          console.error('Error en Products JS:', e);
        }
      }
    }

    function syncFooterAccordions() {
      const accordions = document.querySelectorAll('.footer-accordion');
      if (!accordions.length) return;

      const isDesktop = window.innerWidth >= 769;

      accordions.forEach((item) => {
        item.open = isDesktop;
      });
    }

    async function initializeApp() {
      console.log('Iniciando aplicación...');

      await Promise.all([
        loadComponent('header', 'header-container'),
        loadComponent('search-bar', 'search-bar-container'),
        loadComponent('footer', 'footer-container')
      ]);

      syncFooterAccordions();
      setTimeout(syncFooterAccordions, 200);
      setTimeout(initializeComponents, 300);
    }

    window.addEventListener('resize', syncFooterAccordions);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      initializeApp();
    }
  </script>

  <script>
    (function () {
      function normalizeText(value) {
        return String(value || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();
      }

      function getFieldValue(root, selectors) {
        for (const selector of selectors) {
          const element = root.querySelector(selector);
          if (element && typeof element.value === "string" && element.value.trim()) {
            return element.value.trim();
          }
        }
        return "";
      }

      function getTextValue(root, selectors) {
        for (const selector of selectors) {
          const element = root.querySelector(selector);
          const text = element?.textContent?.trim();
          if (text) return text;
        }
        return "";
      }

      function mapType(value) {
        const clean = normalizeText(value);
        if (["tour", "tours", "experiencias", "experiencia"].includes(clean)) return "tours";
        if (["package", "packages", "paquete", "paquetes"].includes(clean)) return "paquetes";
        return clean;
      }

      function mapDestination(value) {
        const clean = normalizeText(value).replace(/\s+/g, "-");
        const aliases = {
          "machu-picchu": "machu-picchu",
          "machupicchu": "machu-picchu",
          "valle-sagrado": "valle-sagrado",
          "sacred-valley": "valle-sagrado",
          "montana-de-colores": "cusco",
          "montaña-de-colores": "cusco",
          "aguas-calientes": "machu-picchu",
          "peru": ""
        };
        return aliases[clean] !== undefined ? aliases[clean] : clean;
      }

      function parseDuration(value) {
        const clean = normalizeText(value);
        if (!clean) return { duration: "", days: "", nights: "" };
        if (clean.includes("full")) return { duration: "full-day", days: "", nights: "" };
        if (clean.includes("medio") || clean.includes("half")) return { duration: "medio-dia", days: "", nights: "" };

        const compact = clean
          .replace(/\s+/g, "")
          .replace(/dias?/g, "d")
          .replace(/noches?/g, "n")
          .replace(/\//g, "");
        const match = compact.match(/(\d+)d(?:(\d+)n)?/);
        if (!match) return { duration: clean.replace(/\s+/g, "-"), days: "", nights: "" };
        return { duration: "", days: match[1] || "", nights: match[2] || "" };
      }

      function getSearchRoot() {
        return document.getElementById("search-bar-container");
      }

      function isInsideSearchBar(target) {
        const root = getSearchRoot();
        return Boolean(root && target && root.contains(target));
      }

      function isSearchSubmitControl(element) {
        if (!element) return false;

        const control = element.closest([
          'button[type="submit"]',
          'input[type="submit"]',
          '.search-submit',
          '.search-button',
          '.search-btn',
          '[data-search-submit]',
          '[data-action="search"]',
          '[aria-label="Buscar"]'
        ].join(','));

        if (!control) return false;

        const text = normalizeText(control.textContent || control.value || control.getAttribute("aria-label") || "");
        const isExplicitSubmit =
          control.matches('button[type="submit"], input[type="submit"], .search-submit, .search-button, .search-btn, [data-search-submit], [data-action="search"], [aria-label="Buscar"]');

        return isExplicitSubmit || text === "buscar" || text.includes("buscar");
      }

      function buildAllExperiencesUrl(root = getSearchRoot()) {
        const params = new URLSearchParams();
        if (!root) return "./all-experiences.html";

        // Solo tomar texto libre desde campos explícitos de búsqueda.
        // No usamos input[type="text"] genérico porque el buscador puede tener campos
        // de fecha, destino o dropdowns técnicos; si se envían como q producen cero resultados.
        const q = getFieldValue(root, [
          'input[type="search"]:not([readonly]):not([disabled])',
          'input[name="q"]:not([readonly]):not([disabled])',
          'input[name="search"]:not([readonly]):not([disabled])',
          '#searchInput:not([readonly]):not([disabled])',
          '.search-input:not([readonly]):not([disabled])',
          '[data-search-query]:not([readonly]):not([disabled])'
        ]);

        const destination = mapDestination(
          getFieldValue(root, [
            'select[name="destination"]',
            'select[name="destino"]',
            '#destinationSelect',
            '#searchDestination',
            '.destination-select'
          ]) ||
          getTextValue(root, [
            '[data-selected-destination]',
            '.selected-destination',
            '.destination-value'
          ])
        );

        const type = mapType(
          getFieldValue(root, [
            'select[name="type"]',
            'select[name="tipo"]',
            'select[name="kind"]',
            '#typeSelect',
            '#searchType',
            '.type-select'
          ]) ||
          getTextValue(root, [
            '[data-selected-type]',
            '.selected-type',
            '.type-value'
          ])
        );

        const durationValue = getFieldValue(root, [
          'select[name="duration"]',
          'select[name="duracion"]',
          '#durationSelect',
          '#searchDuration',
          '.duration-select'
        ]) || getTextValue(root, [
          '[data-selected-duration]',
          '.selected-duration',
          '.duration-value'
        ]);

        const parsedDuration = parseDuration(durationValue);

        if (q) params.set("q", q);
        if (destination) params.set("destino", destination);
        if (type) params.set("tipo", type);
        if (parsedDuration.days) params.set("days", parsedDuration.days);
        if (parsedDuration.nights) params.set("nights", parsedDuration.nights);
        if (parsedDuration.duration) params.set("duration", parsedDuration.duration);

        const queryString = params.toString();
        return `./all-experiences.html${queryString ? `?${queryString}` : ""}`;
      }

      function redirectToAllExperiences(event, explicitControl) {
        const root = getSearchRoot();
        if (!root) return;

        event.preventDefault();
        event.stopPropagation();
        window.location.href = buildAllExperiencesUrl(root);
      }

      function handleSearchBarClick(event) {
        if (!isInsideSearchBar(event.target)) return;

        const clickedButton = event.target.closest("button");
        const clickedSubmit = isSearchSubmitControl(event.target);

        if (clickedSubmit) {
          redirectToAllExperiences(event, clickedSubmit);
          return;
        }

        // Muchos botones de dropdown dentro de formularios heredan type="submit" por defecto.
        // Evitamos que esos clicks envíen el formulario, pero dejamos que sus handlers abran/selecten opciones.
        if (clickedButton && !clickedButton.hasAttribute("type")) {
          clickedButton.setAttribute("type", "button");
        }
      }

      function handleSearchBarSubmit(event) {
        if (!isInsideSearchBar(event.target)) return;

        const submitter = event.submitter || document.activeElement;
        if (isSearchSubmitControl(submitter)) {
          redirectToAllExperiences(event, submitter);
          return;
        }

        // Si el submit viene de un botón de filtro, calendario o dropdown, no redirige.
        event.preventDefault();
      }

      document.addEventListener("click", handleSearchBarClick, true);
      document.addEventListener("submit", handleSearchBarSubmit, true);

      window.MyCuscoTripIndexSearchRedirect = {
        buildAllExperiencesUrl
      };
    })();
  </script>
