<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Reserva</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .eyebrow {
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #111827;
    }

    .intro {
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
    }

    .field input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .field input:focus {
      border-color: #111827;
    }

    .error {
      display: none;
      margin-bottom: 16px;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      border: none;
      background: #111827;
      color: #ffffff;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      font-size: 14px;
      color: #374151;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <p class="eyebrow">Mi Reserva</p>
      <h1>Consulta tu reserva</h1>
      <p class="intro">
        Ingresa tu código de reserva y apellido para consultar la información de tu viaje.
      </p>

      <form id="reservaForm">
        <div class="field">
          <label for="codigo">Código de reserva</label>
          <input
            type="text"
            id="codigo"
            name="codigo"
            placeholder="Ej. CUS12345"
            required
          />
        </div>

        <div class="field">
          <label for="apellido">Apellido</label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            placeholder="Ej. Garcia"
            required
          />
        </div>

        <div id="errorMessage" class="error"></div>

        <button type="submit" class="btn" id="buscarBtn">
          Buscar reserva
        </button>
      </form>

      <a href="./index.html" class="back-link">← Volver al inicio</a>
    </section>
  </main>

  <script>
    const form = document.getElementById("reservaForm");
    const errorMessage = document.getElementById("errorMessage");
    const buscarBtn = document.getElementById("buscarBtn");

    function normalizarTexto(texto) {
      return texto
        .trim()
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      errorMessage.style.display = "none";
      errorMessage.textContent = "";
      buscarBtn.disabled = true;
      buscarBtn.textContent = "Buscando...";

      const codigo = document.getElementById("codigo").value;
      const apellido = document.getElementById("apellido").value;

      try {
        const response = await fetch("./data/reservas.json");
        const reservas = await response.json();

        const reservaEncontrada = reservas.find((reserva) => {
          return (
            normalizarTexto(reserva.codigo) === normalizarTexto(codigo) &&
            normalizarTexto(reserva.apellido) === normalizarTexto(apellido)
          );
        });

        if (!reservaEncontrada) {
          errorMessage.textContent = "No encontramos una reserva con esos datos.";
          errorMessage.style.display = "block";
          buscarBtn.disabled = false;
          buscarBtn.textContent = "Buscar reserva";
          return;
        }

        localStorage.setItem("reservaSeleccionada", JSON.stringify(reservaEncontrada));
        window.location.href = "./detalle-reserva.html";
      } catch (error) {
        errorMessage.textContent = "Ocurrió un error al consultar la reserva.";
        errorMessage.style.display = "block";
      } finally {
        buscarBtn.disabled = false;
        buscarBtn.textContent = "Buscar reserva";
      }
    });
  </script>
</body>
</html>
